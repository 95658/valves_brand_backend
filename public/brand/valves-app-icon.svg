<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- App Icon Background: Deep Stealth Onyx with subtle rim highlight -->
    <radialGradient id="iconBg" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#1f1f23" />
      <stop offset="60%" stop-color="#0c0c0e" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>
    
    <!-- Monogram Gradient -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e4e4e7" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>

    <!-- Neon Volt Core -->
    <linearGradient id="voltGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4ff00" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- iOS / Android Squircle Base -->
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="url(#iconBg)" />
  
  <!-- Subtle Border Rim -->
  <rect x="2" y="2" width="508" height="508" rx="113" ry="113" fill="none" stroke="#27272a" stroke-width="2" opacity="0.6" />

  <!-- Monogram Glyph Centered -->
  <g transform="translate(0, 5)" filter="url(#subtleShadow)">
    <!-- Outer Flow Wings -->
    <path d="M 130 140 L 195 140 L 256 295 L 222 295 Z" fill="url(#glyphGrad)" opacity="0.85" />
    <path d="M 382 140 L 317 140 L 256 295 L 290 295 Z" fill="url(#glyphGrad)" opacity="0.75" />

    <!-- Center Apex Anchor: The Core V -->
    <path d="M 180 200 L 256 385 L 332 200 L 294 200 L 256 295 L 218 200 Z" fill="#ffffff" />

    <!-- Precision Laser Indicator (Volt Accent) -->
    <polygon points="256,325 242,275 270,275" fill="url(#voltGlow)" />
  </g>

  <!-- High-end apparel micro-typography -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Space Grotesk', sans-serif" font-size="14" font-weight="800" letter-spacing="8" fill="#52525b" text-anchor="middle">
    VALVES
  </text>
</svg>
